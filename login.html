<!DOCTYPE html>
<html>

<head>
    <title>Cyber Threat Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

    <div class="logo">🛡️</div>

    <h2>Cyber Threat Brief</h2>

    <p class="subtitle">
        Advanced Threat Intelligence Platform
    </p>

    <input
    type="text"
    id="username"
    placeholder="Enter Username">

    <input
    type="password"
    id="password"
    placeholder="Enter Password">

    <button onclick="login()">
        Secure Login
    </button>

    <p id="msg"></p>

    <div class="footer">
        Secured by Cyber Analytics Engine
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
